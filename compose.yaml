# docker compose up                              → GPU (NVIDIA), pulls the published image
# docker compose --profile cpu up lair-cpu        → CPU only
# add --build to compile the image from this repo instead
#
# LAIR_MODELS  folder with .gguf files (default ./models); if empty, a small model is downloaded into it
# LAIR_DEFAULT_MODEL  URL of the .gguf downloaded on first run ("" to never download)
# LAIR_PORT    host port (default 8080, bound to localhost only)
# LAIR_TOKEN   if set, the UI and API ask for it
#
# docker compose --profile web up   also starts SearXNG for the agent's web search

x-lair: &lair
  ports:
    - "127.0.0.1:${LAIR_PORT:-8080}:8080"
  volumes:
    - "${LAIR_MODELS:-./models}:/models"
    - lair-data:/data
  environment:
    - LAIR_TOKEN
    - LAIR_DEFAULT_MODEL
    - LAIR_DATA=/data
    - LAIR_SEARXNG=http://searxng:8080
  restart: unless-stopped
  # Reaps the shell commands the agent starts.
  init: true

services:
  lair:
    <<: *lair
    build:
      context: .
      target: cuda
      args:
        CUDA_ARCH: "${CUDA_ARCH:-86}"
        BUILD_JOBS: "${LAIR_BUILD_JOBS:-4}"
    image: ghcr.io/bernardofernandezz/lair:cuda
    devices:
      - nvidia.com/gpu=all

  lair-cpu:
    <<: *lair
    profiles: [cpu]
    build:
      context: .
      target: cpu
      args:
        BUILD_JOBS: "${LAIR_BUILD_JOBS:-4}"
    image: ghcr.io/bernardofernandezz/lair:cpu
    command: ["--gpu-layers", "0"]

  searxng:
    profiles: [web]
    image: searxng/searxng:2026.10.25-54ca1d9cf
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET
    restart: unless-stopped

volumes:
  lair-data:
