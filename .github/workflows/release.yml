# On every version tag (git tag v0.1.0 && git push --tags): the binaries install.sh downloads, and the
# images compose.yaml pulls. The release stays a draft until SHA256SUMS is up: /releases/latest skips
# drafts, so install.sh and `lair update` never see a release they can't verify.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

# A tag pushed again replaces the run still going for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # `lair update` compares the binary's version to the tag, so they must agree; checked once, before any build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "Cargo.toml version doesn't match tag $GITHUB_REF_NAME"; exit 1; }

  # One job creates the draft, so the binary jobs can't race to create it; notes come from the commits.
  draft:
    needs: [ci, check]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag

  binaries:
    needs: draft
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest runner with a recent enough glibc, so the binary runs on older distros too.
          - asset: lair-linux-x86_64-cpu
            os: ubuntu-22.04
            features: ""
          # ggml-vulkan needs newer Vulkan and SPIR-V headers than 22.04 ships.
          - asset: lair-linux-x86_64-vulkan
            os: ubuntu-24.04
            features: vulkan
            apt: libvulkan-dev glslc spirv-headers
          # Raspberry Pi 4 and later, Jetson, Graviton: llama.cpp builds for plain armv8-a here.
          - asset: lair-linux-arm64-cpu
            os: ubuntu-22.04-arm
            features: ""
          - asset: lair-macos-arm64
            os: macos-15
            features: metal
          - asset: lair-windows-x86_64-cpu
            os: windows-latest
            features: ""
          - asset: lair-windows-x86_64-vulkan
            os: windows-latest
            features: vulkan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev ${{ matrix.apt }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - name: Vulkan SDK
        if: runner.os == 'Windows' && matrix.features == 'vulkan'
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe
          Start-Process -Wait .\vulkan-sdk.exe -ArgumentList '--accept-licenses --default-answer --confirm-command install'
          $sdk = (Get-ChildItem C:\VulkanSDK | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      # .tar.gz on Windows too: its own tar unpacks it, and `publish` checksums one kind of file.
      - run: tar -czf ${{ matrix.asset }}.tar.gz -C target/release lair${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release download "$GITHUB_REF_NAME" --pattern '*.tar.gz'
      - run: sha256sum *.tar.gz | tee SHA256SUMS
      - run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # `brew tap bernardofernandezz/lair https://github.com/bernardofernandezz/lair` reads Formula/ from main.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS
      - run: mkdir -p Formula && scripts/brew-formula.sh "$GITHUB_REF_NAME" SHA256SUMS > Formula/lair.rb
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lair.rb
          git diff --cached --quiet || { git commit -m "chore: Homebrew formula for $GITHUB_REF_NAME" && git push; }

  image:
    needs: [ci, check]
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            arch: ""
          # One image for RTX 20xx (75), 30xx (86), 40xx (89) and 50xx (120).
          - target: cuda
            arch: "75;86;89;120"
    steps:
      - name: Free disk space
        # The CUDA devel image alone is ~9 GB; the runner starts with ~14 GB free.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            BUILD_JOBS=4
            ${{ matrix.arch && format('CUDA_ARCH={0}', matrix.arch) || '' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lair:${{ matrix.target }}
            ghcr.io/${{ github.repository_owner }}/lair:${{ github.ref_name }}-${{ matrix.target }}
            ${{ matrix.target == 'cuda' && format('ghcr.io/{0}/lair:latest', github.repository_owner) || '' }}
          # In the registry, not the Actions cache: that one is scoped per tag, so no release could reuse
          # the last one's. mode=max keeps the dependency layer (llama.cpp, the CUDA kernels).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/lair:buildcache-${{ matrix.target }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/lair:buildcache-${{ matrix.target }},mode=max
