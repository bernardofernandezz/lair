[package]
name = "lair"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
html2text = "0.17.4"
llama-cpp-2 = { version = "0.1.161", features = ["mtmd"] }
mime_guess = "2.0.5"
pdf-extract = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
self_cell = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[features]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
